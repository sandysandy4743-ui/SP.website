<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameZone - 100 Free Games</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
}

/* HEADER */
header {
    padding: 25px 20px;
    text-align: center;
    background: linear-gradient(135deg, #111936, #18264d);
    border-bottom: 2px solid #263766;
}

.logo-title {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo-title span {
    color: #00e5ff;
}

.subtitle {
    margin-top: 8px;
    color: #aeb9d6;
    font-size: 15px;
}

/* SEARCH */
.search-area {
    padding: 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

#searchBox {
    width: min(600px, 90%);
    padding: 15px 20px;
    border-radius: 30px;
    border: 2px solid #334579;
    outline: none;
    background: #121a32;
    color: white;
    font-size: 16px;
}

#searchBox:focus {
    border-color: #00e5ff;
}

/* CATEGORY BUTTONS */
.categories {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 0 20px 25px;
}

.category-btn {
    border: none;
    padding: 10px 18px;
    border-radius: 25px;
    background: #1a2545;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.category-btn:hover,
.category-btn.active {
    background: #00bcd4;
    color: #001016;
}

/* GAME GRID */
.game-container {
    width: min(1400px, 95%);
    margin: auto;
    padding: 10px 0 40px;

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 18px;
}

/* GAME CARD */
.game-card {
    background: #121a32;
    border: 1px solid #27365f;
    border-radius: 18px;
    padding: 15px;
    transition: 0.25s;
    overflow: hidden;
}

.game-card:hover {
    transform: translateY(-6px);
    border-color: #00e5ff;
    box-shadow: 0 10px 30px rgba(0, 229, 255, 0.12);
}

/* GAME LOGO */
.game-logo {
    width: 100%;
    height: 150px;
    border-radius: 14px;
    overflow: hidden;
    background: #202c4e;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 12px;
}

.game-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* GAME TEXT */
.game-name {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 6px;
}

.game-category {
    color: #8e9abd;
    font-size: 13px;
    margin-bottom: 12px;
}

/* PLAY BUTTON */
.play-btn {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 10px;
    background: #00c853;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

.play-btn:hover {
    background: #00a844;
}

/* NO RESULT */
.no-result {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px;
    color: #aeb9d6;
    font-size: 20px;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 25px;
    background: #080d1b;
    color: #7f8baa;
}

/* MOBILE */
@media (max-width: 600px) {

    .logo-title {
        font-size: 28px;
    }

    .game-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .game-logo {
        height: 110px;
    }

    .game-name {
        font-size: 14px;
    }

    .play-btn {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo-title">
        🎮 Game<span>Zone</span>
    </div>

    <div class="subtitle">
        100 Free Games • Play Online
    </div>

</header>


<div class="search-area">

    <input
        type="text"
        id="searchBox"
        placeholder="🔍 Search games..."
    >

</div>


<div class="categories">

    <button class="category-btn active" onclick="filterCategory('All', this)">
        All
    </button>

    <button class="category-btn" onclick="filterCategory('Action', this)">
        Action
    </button>

    <button class="category-btn" onclick="filterCategory('Racing', this)">

<footer>

/* =========================================
   GAME LOGO
========================================= */

function getLogo(game, index) {

    /*
       ஒவ்வொரு game-க்கும் தனி generated logo.
       Game name + index பயன்படுத்தப்படுகிறது.
    */

    const seed = encodeURIComponent(
        game.name + "-" + index
    );

    return `https://api.dicebear.com/9.x/initials/svg?seed=${seed}&backgroundType=gradientLinear`;
}


/* =========================================
   DISPLAY GAMES
========================================= */

function displayGames(list) {

    const container =
        document.getElementById("gameContainer");

    container.innerHTML = "";

    if (list.length === 0) {

        container.innerHTML = `
            <div class="no-result">
                😔 Game கிடைக்கவில்லை
            </div>
        `;

        return;
    }

    list.forEach((game, index) => {

        const card =
            document.createElement("div");

        card.className = "game-card";

        card.innerHTML = `

            <div class="game-logo">

                <img
                    src="${getLogo(game, index)}"
                    alt="${game.name} logo"
                    loading="lazy"
                >

            </div>

            <div class="game-name">
                ${game.name}
            </div>

            <div class="game-category">
                ${game.category}
            </div>

            <button
                class="play-btn"
                onclick="playGame('${game.name.replace(/'/g, "\\'")}')"
            >
                ▶ Play Now
            </button>

        `;

        container.appendChild(card);

    });

}


/* =========================================
   SEARCH
========================================= */

document
.getElementById("searchBox")
.addEventListener("input", function() {

    const searchText =
        this.value.toLowerCase().trim();

    const filtered =
        games.filter(game =>
            game.name
                .toLowerCase()
                .includes(searchText)
        );

    displayGames(filtered);

});


/* =========================================
   CATEGORY FILTER
========================================= */

function filterCategory(category, button) {

    document
    .querySelectorAll(".category-btn")
    .forEach(btn => {
        btn.classList.remove("active");
    });

    button.classList.add("active");

    if (category === "All") {

        displayGames(games);

        return;
    }

    const filtered =
        games.filter(game =>
            game.category === category
        );

    displayGames(filtered);
}


/* =========================================
   PLAY BUTTON
========================================= */

function playGame(gameName) {

    /*
       இங்கே ஒவ்வொரு game-க்கும்
       தனித்தனி HTML game URL / game file
       சேர்க்கலாம்.
    */

    alert(
        "🎮 " +
        gameName +
        "\\n\\nGame loading..."
    );

}


/* =========================================
   START
========================================= */

displayGames(games);
