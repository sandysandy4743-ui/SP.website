<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GameZone - Play Free Games!</title>


    <style>

        /* =========================
           BODY
        ========================== */

        body {
            margin: 0;
            font-family: sans-serif;
            background: #f7f7f7;
            color: #333;
            text-align: center;
        }


        /* =========================
           HEADER
        ========================== */

        header {
            background: #1e293b;
            padding: 15px;
            font-size: 20px;
            color: #38bdf8;
            font-weight: bold;
        }


        /* =========================
           CONTAINER
        ========================== */

        .container {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            padding: 15px;
            box-sizing: border-box;
        }


        /* =========================
           GAME PLAYER
        ========================== */

        .game-frame {
            position: relative;
            width: 100%;
            height: 500px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }


        .game-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
        }


        /* =========================
           GAME GRID
        ========================== */

        .grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(140px, 1fr));

            gap: 10px;

            margin-top: 20px;
        }


        /* =========================
           GAME CARD
        ========================== */

        .card {
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;

            transition: transform 0.2s;
        }


        .card:hover {
            transform: scale(1.03);
        }


        .card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            display: block;
        }


        .card p {
            margin: 10px;
            font-weight: bold;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            margin-top: 30px;
            padding: 15px;
            background: #1e293b;
            color: #94a3b8;
            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .game-frame {
                height: 350px;
            }

            .grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>
        🎮 GameZone - Play Free Games!
    </header>



    <!-- =========================
         MAIN CONTAINER
    ========================== -->

    <div class="container">


        <h2>100+ Games</h2>


        <!-- =========================
             GAME PLAYER
        ========================== -->

        <div class="game-frame">

            <iframe
                id="player"
                src="about:blank"
                title="Game Player"
                allowfullscreen>
            </iframe>

        </div>



        <!-- =========================
             GAME GRID
        ========================== -->

        <div class="grid">


            <div class="card"
                 onclick="play(0)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="Master Avengers">

            </div>


            <div class="card"
                 onclick="play(1)">

                    src="https://via.placeholder.com/300x180"
                    alt="Subway Surfers">

                <p>Subway Surfers</p>

            </div>


            <div class="card"
                 onclick="play(2)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="Run 2">

                <p>Run 2</p>

            </div>


            <div class="card"
                 onclick="play(3)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="Bird">

                <p>Bird</p>

            </div>


            <div class="card"
                 onclick="play(4)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="Hill Climb Racing">

                <p>Hill Climb Racing</p>

            </div>


            <div class="card"
                 onclick="play(5)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="The Rope">

                <p>The Rope</p>

            </div>


            <div class="card"
                 onclick="play(6)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="10">

                <p>10</p>

            </div>


            <div class="card"
                 onclick="play(7)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="Ninja">

                <p>Ninja</p>

            </div>


            <div class="card"
                 onclick="play(8)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="Pool">

                <p>Pool</p>

            </div>


            <div class="card"
                 onclick="play(9)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="Car Parking">

                <p>Car Parking</p>

            </div>


            <div class="card"
                 onclick="play(10)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="Traffic Racer">

                <p>Traffic Racer</p>

            </div>


            <div class="card"
                 onclick="play(11)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="2048">

            </div>


            <div class="card"
                 onclick="play(12)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="Snake and Ladders">

                <p>Snake &amp; Ladders</p>

            </div>


            <div class="card"
                 onclick="play(13)">

                <img
                    src="https://via.placeholder.com/300x180"
                    alt="Bubble Shooter">

                <p>Bubble Shooter</p>

            </div>


        </div>

    </div>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 GameZone.
        </p>

        <p>
            <a href="#">Home</a>
            |
            <a href="#">Privacy</a>
            |
            <a href="#">Contact Us</a>
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        function play(i) {

            const games = [

                "about:blank",
                "about:blank",
                "about:blank",
                "about:blank",
                "about:blank",
                "about:blank",
                "about:blank",
                "about:blank",
                "about:blank",
                "about:blank",
                "about:blank",
                "about:blank",
                "about:blank",
                "about:blank"

            ];

            document.getElementById("player").src = games[i];

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }

    </script>


</body>

</html>
