*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080d18;color:#fff;min-height:100vh}
header{padding:28px 18px;text-align:center;background:linear-gradient(135deg,#111a34,#152b4b);border-bottom:1px solid #2a416d}
h1{font-size:clamp(28px,5vw,46px)} h1 span{color:#00e5ff}
.subtitle{margin-top:8px;color:#aab8d4}
.toolbar{width:min(1200px,94%);margin:20px auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#search{flex:1 1 320px;max-width:650px;padding:14px 18px;border:1px solid #33486f;border-radius:30px;background:#10182b;color:#fff;outline:none;font-size:16px}
#search:focus{border-color:#00e5ff}
.filter{padding:11px 16px;border:0;border-radius:22px;background:#1a2743;color:#fff;cursor:pointer;font-weight:700}
.filter.active,.filter:hover{background:#00cfe8;color:#001016}
#count{width:min(1200px,94%);margin:0 auto 14px;color:#8fa0c0}
.grid{width:min(1200px,94%);margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding-bottom:35px}
.card{background:#10182b;border:1px solid #273b60;border-radius:16px;padding:12px;transition:.2s;overflow:hidden}
.card:hover{transform:translateY(-4px);border-color:#00e5ff}
.logo{height:145px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative}
.logo .num{position:absolute;top:8px;left:9px;font-size:11px;font-weight:700;background:rgba(0,0,0,.35);padding:4px 7px;border-radius:10px}
.logo .icon{font-size:58px;line-height:1}
.logo .brand{font-size:13px;font-weight:800;margin-top:8px;text-shadow:0 1px 3px #000}
.name{font-size:16px;font-weight:800;margin:11px 2px 5px}
.cat{font-size:12px;color:#91a0bd;margin:0 2px 11px}
.play{width:100%;border:0;border-radius:10px;padding:10px;background:#00c853;color:#fff;font-weight:800;cursor:pointer}
.play:hover{background:#00a944}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:#9aa8c3}
footer{padding:22px;text-align:center;color:#7585a4;background:#060a12}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.dialog{width:min(480px,100%);background:#111a2d;border:1px solid #38527f;border-radius:18px;padding:24px;text-align:center}
.dialog .big{font-size:64px}
.dialog h2{margin:8px 0} .dialog p{color:#aebbd2;margin-bottom:18px}
.close{border:0;border-radius:10px;padding:10px 18px;background:#00cfe8;color:#001016;font-weight:800;cursor:pointer}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.logo{height:105px}.logo .icon{font-size:42px}.name{font-size:14px}}
</style>

const count = document.getElementById("count");
const modal = document.getElementById("modal");
const modalIcon = document.getElementById("modalIcon");
const modalTitle = document.getElementById("modalTitle");
const modalText = document.getElementById("modalText");

const categoryColors = {
  Action: ["#ff512f","#dd2476"],
  Racing: ["#11998e","#38ef7d"],
  Puzzle: ["#4776e6","#8e54e9"],
  Sports: ["#f7971e","#ffd200"],
  Arcade: ["#00c6ff","#0072ff"],
  Adventure: ["#56ab2f","#a8e063"]
};

const categories = ["All", ...new Set(games.map(game => game.category))];

function makeLogo(game, index) {
  const pair = categoryColors[game.category] || ["#434343","#000000"];
  return `
    <div class="logo" style="background:linear-gradient(135deg,${pair[0]},${pair[1]})">
      <span class="num">GAME ${index + 1}</span>
      <span class="icon">${game.icon}</span>
      <span class="brand">${escapeHtml(game.name)}</span>
    </div>`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[char]));
}

function renderFilters(active = "All") {
  filters.innerHTML = "";
  categories.forEach(category => {
    const button = document.createElement("button");
    button.className = "filter" + (category === active ? " active" : "");
    button.textContent = category;
    button.type = "button";
    button.addEventListener("click", () => {
      document.querySelectorAll(".filter").forEach(btn => btn.classList.remove("active"));
      button.classList.add("active");
      renderGames(category);
    });
    filters.appendChild(button);
  });
}

function renderGames(category = "All") {
  const query = search.value.trim().toLowerCase();
  const result = games.filter(game => {
    const categoryOk = category === "All" || game.category === category;
    const searchOk = game.name.toLowerCase().includes(query);
    return categoryOk && searchOk;
  });

  count.textContent = `Showing ${result.length} of ${games.length} games`;
  grid.innerHTML = "";

  if (!result.length) {
    grid.innerHTML = '<div class="empty">😔 No games found.</div>';
    return;
  }

  result.forEach(game => {
    const index = games.indexOf(game);
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      ${makeLogo(game, index)}
      <div class="name">${escapeHtml(game.name)}</div>
      <div class="cat">${escapeHtml(game.category)}</div>
      <button class="play" type="button">▶ Play Now</button>
    `;
    card.querySelector(".play").addEventListener("click", () => openGame(game));
    grid.appendChild(card);
  });
}

function openGame(game) {
  modalIcon.textContent = game.icon;
  modalTitle.textContent = game.name;
  modalText.textContent = `${game.name} is selected. Add its real game URL/file inside openGame() when you have the game.`;
  modal.classList.add("show");
}

function closeGame() {
  modal.classList.remove("show");
}

search.addEventListener("input", () => {
  const active = document.querySelector(".filter.active");
  renderGames(active ? active.textContent : "All");
});

document.getElementById("closeModal").addEventListener("click", closeGame);
modal.addEventListener("click", event => {
  if (event.target === modal) closeGame();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeGame();
});

renderFilters();
renderGames();
