<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100+ அல்டிமேட் கேமிங் ஜோன் 🎮</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; text-align: center; }
        
        /* கேடஜரி ஃபில்டர் பொத்தான்கள் 🔘 */
        .filter-btn { background: #1e293b; color: #38bdf8; border: 2px solid #38bdf8; padding: 10px 20px; margin: 5px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .filter-btn:hover, .filter-btn.active { background: #38bdf8; color: #0f172a; }

        /* கேம் கிரிட் 🧊 */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .game-card { background: #1e293b; border-radius: 12px; padding: 10px; border: 1px solid #334155; }
        .game-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        
        /* Play பொத்தான் ▶️ */
        .play-btn { background: #22c55e; color: white; border: none; padding: 8px 15px; margin-top: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }

        /* Play Popup (Modal) திரையமைப்பு 🪟 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; width: 80%; height: 80%; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; color: red; cursor: pointer; }
        iframe { width: 100%; height: calc(100% - 30px); border: none; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>🎮 அல்டிமேட் கேமிங் போர்ட்டல் 🕹️</h1>

    <!-- கேடஜரி ஃபில்டர்கள் -->
    <div id="category-buttons">
        <button class="filter-btn active" onclick="filterGames('All')">அனைத்தும்</button>
        <button class="filter-btn" onclick="filterGames('Fighting')">Fighting 🥊</button>
        <button class="filter-btn" onclick="filterGames('Racing')">Racing 🏎️</button>
        <button class="filter-btn" onclick="filterGames('Adventure')">Adventure 🧗</button>
        <button class="filter-btn" onclick="filterGames('Running')">Running 🏃</button>
    </div>

    <!-- கேம்கள் தோன்றும் இடம் -->
    <div class="games-grid" id="gamesContainer"></div>

    <!-- கேம் விளையாடும் Popup Window -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeGame()">&times; மூடவும்</span>
            <iframe id="gameIframe" src=""></iframe>
        </div>
    </div>

    <script>
        // கேம்களின் தரவுப்பட்டியல் (Data Array) 📜
        const games = [
            { name: "Street Fighter 🥊", category: "Fighting", logo: "https://dummyimage.com/200x120/ef4444/ffffff&text=Fighting+Game", url: "https://playtictactoe.org/" },
            { name: "Car Speed Race 🏎️", category: "Racing", logo: "https://dummyimage.com/200x120/3b82f6/ffffff&text=Car+Race", url: "https://play2048.co/" },
            { name: "Jungle Adventure 🧗", category: "Adventure", logo: "https://dummyimage.com/200x120/10b981/ffffff&text=Adventure", url: "https://freepacman.org/" },
            { name: "Endless Runner 🏃", category: "Running", logo: "https://dummyimage.com/200x120/f59e0b/ffffff&text=Running+Game", url: "https://playsnakegame.net/" }
            // இதே அமைப்பில் 100 கேம்களின் விவரங்களையும் சேர்த்துக்கொள்ளலாம்!
        ];

        const container = document.getElementById('gamesContainer');

        // கேம்களைத் திரையில் காட்டும் ஃபங்க்ஷன்
        function displayGames(gameArray) {
            container.innerHTML = "";
            gameArray.forEach(game => {
                container.innerHTML += `
                    <div class="game-card">
                        <img src="${game.logo}" alt="${game.name}">
                        <h3>${game.name}</h3>
                        <button class="play-btn" onclick="playGame('${game.url}')">விளையாடு ▶</button>
                    </div>
                `;
            });
        }

        // கேடஜரி ஃபில்டர் ஃபங்க்ஷன் 🔍
        function filterGames(category) {
            if (category === 'All') {
                displayGames(games);
            } else {
                const filtered = games.filter(g => g.category === category);
                displayGames(filtered);
            }
        }

        // Popup-ல் கேமைத் திறக்கும் ஃபங்க்ஷன் 🕹️
        function playGame(url) {
            document.getElementById('gameIframe').src = url;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeGame() {
            document.getElementById('gameIframe').src = "";
            document.getElementById('gameModal').style.display = 'none';
        }

        // ஆரம்பத்தில் அனைத்து கேம்களையும் காட்ட
        displayGames(games);
    </script>
</body>
</html>
