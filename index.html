<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 அட்ராக்டிவ் கேம்ஸ் 🎮</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #00fff5;
            text-shadow: 0 0 10px #00fff5;
        }

        /* 100 கேம்களை அழகான கிரிட் வடிவில் காட்ட 🧊 */
        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        /* ஒவ்வொரு கேம் கார்டின் டிசைன் 🃏 */
        .game-card {
            background: #16213e;
            border: 2px solid #0f3460;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        /* ஹோவர் அனிமேஷன் Effect ✨ */
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px #e94560;
            border-color: #e94560;
        }

        /* லோகோ டிசைன் 🖼️ */
        .game-logo {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #0f3460;
        }

        .game-title {
            font-size: 1.1rem;
            margin: 12px 0;
            color: #e94560;
        }

        /* கேம் திரை (Iframe) 🕹️ */
        .game-frame {
            width: 100%;
            height: 350px;
            border: none;
            border-radius: 8px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>🎮 100 அட்ராக்டிவ் கேமிங் ஜோன் 🕹️</h1>

    <!-- 100 கேம்களும் இங்கு தானாக உருவாகும் -->
    <div class="games-container" id="gamesContainer"></div>

    <script>
        // கேம்களின் லிஸ்ட் (மாதிரி கேம்கள் இணைக்கப்பட்டுள்ளன) 🎯
        const gameList = [
            { title: "Tic Tac Toe ❌⭕", url: "https://playtictactoe.org/", logo: "https://dummyimage.com/300x160/0f3460/00fff5&text=Tic+Tac+Toe+🎮" },
            { title: "2048 Game 🔢", url: "https://play2048.co/", logo: "https://dummyimage.com/300x160/0f3460/00fff5&text=2048+Game+🔢" },
            { title: "Pacman Classic 🟡", url: "https://freepacman.org/", logo: "https://dummyimage.com/300x160/0f3460/00fff5&text=Pacman+🟡" },
            { title: "Snake Game 🐍", url: "https://playsnakegame.net/", logo: "https://dummyimage.com/300x160/0f3460/00fff5&text=Snake+Game+🐍" }
        ];

        const container = document.getElementById('gamesContainer');

        // 100 கேம்களை உருவாக்க லூப் (Loop) 🔄
        for (let i = 1; i <= 100; i++) {
            // முதற்கட்டமாக உள்ள கேம்களை சுழற்சி முறையில் பயன்படுத்த அல்லது புதிய லிங்க் மாற்ற
            const currentGame = gameList[(i - 1) % gameList.length];

            const card = document.createElement('div');
            card.className = 'game-card';

            card.innerHTML = `
                <img src="${currentGame.logo}" alt="Game ${i}" class="game-logo">
                <div class="game-title">கேம் ${i}: ${currentGame.title}</div>
                <iframe src="${currentGame.url}" class="game-frame" allowfullscreen loading="lazy"></iframe>
            `;

            container.appendChild(card);
        }
    </script>

</body>
</html>
